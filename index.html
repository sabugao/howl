<style>
:root{--ink:#202124;--paper:#fcfbff;--muted:#55545b}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}a{color:inherit}.site{min-height:100svh;max-width:none;margin:0;padding:clamp(24px,4vw,56px);display:grid;grid-template-rows:auto 1fr auto;gap:24px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 14% 2%,#ffdfd1,transparent 38%),radial-gradient(ellipse at 42% 57%,#d1f5e8,transparent 45%),radial-gradient(ellipse at 87% 95%,#e0d6fb,transparent 47%),#fcfbff}.header{display:flex;align-items:center;justify-content:space-between}.brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none}.brand b{font-size:clamp(31px,3vw,44px);font-weight:750;letter-spacing:-.075em}.mark{height:34px;display:flex;align-items:center;gap:1px}.mark i{display:block;width:3px;border-radius:3px;background:var(--ink)}.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,40%);align-items:center;gap:clamp(24px,6vw,100px)}.strapline{font-size:clamp(13px,1.4vw,17px);font-weight:750;letter-spacing:.06em;margin:0 0 24px}.hero h1{font-size:clamp(64px,7.6vw,120px);line-height:.91;font-weight:770;letter-spacing:-.07em;margin:0}.cta{display:inline-flex;align-items:center;gap:18px;margin-top:48px;border-radius:100px;padding:17px 23px;background:var(--ink);color:white;text-decoration:none;font-weight:650;font-size:clamp(15px,1.35vw,19px);transition:transform .2s}.cta:hover{transform:translateY(-2px)}.cta:focus-visible,.clip:focus-visible,.links a:focus-visible{outline:3px solid #527b74;outline-offset:4px}.phone-stage{display:grid;place-items:center;padding:14px 0}.phone{width:min(100%,350px);aspect-ratio:440/956;border:9px solid var(--ink);border-radius:52px;background:var(--paper);overflow:hidden;box-shadow:0 24px 46px #3030442b}.screen{height:100%;position:relative;padding:20px 19px;background:radial-gradient(ellipse at 100% 2%,#fff0eb,transparent 40%),radial-gradient(ellipse at 10% 94%,#e5f8f2,transparent 48%),#fcfbff}.status{font-size:12px;font-weight:700;display:flex;justify-content:space-between}.app-nav{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;text-align:center;margin:45px 0 13px}.app-nav b{font-size:27px;letter-spacing:-.07em}.menu{display:flex;flex-direction:column;gap:4px}.menu i{display:block;width:19px;height:2px;background:var(--ink);border-radius:2px}.menu i:nth-child(2){width:14px}.menu i:nth-child(3){width:9px}.search{text-align:right;font-size:26px}.pills{display:flex;justify-content:center;gap:5px;font-size:12px;font-weight:650}.pills>*{padding:7px 13px}.pills b{border-radius:24px;background:#fff;border:1px solid #e5e2e8}.listen{font-size:14px;font-weight:700;margin:48px 0 14px}.clip{width:100%;min-height:74px;border:0;background:none;display:flex;align-items:center;gap:8px;text-align:left;padding:10px 0;cursor:pointer;color:var(--ink)}.clip .who{font-weight:700;font-size:12px;max-width:105px;min-width:97px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.clip .wave{height:34px;display:flex;align-items:center;gap:2px;flex:1;overflow:hidden}.clip .wave i{flex:0 0 2px;width:2px;background:var(--ink);border-radius:2px}.clip[aria-pressed=true] .wave i:nth-child(-n+13){background:#527b74}.clip .play{font-size:23px;line-height:1}.mic{position:absolute;bottom:35px;left:calc(50% - 43px);height:47px;width:86px;border-radius:30px;background:var(--ink);display:grid;place-items:center}.homebar{position:absolute;bottom:9px;left:calc(50% - 39px);width:78px;height:4px;border-radius:3px;background:var(--ink)}.footer{border-top:1px solid #20212422;padding-top:18px;display:flex;justify-content:flex-end}.links{display:flex;gap:20px;font-size:13px;color:#555}.links a{text-decoration:none}.links a:hover{text-decoration:underline}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:850px){.site{min-height:0;gap:32px}.hero{grid-template-columns:1fr;gap:36px}.hero h1{font-size:clamp(60px,11vw,84px)}.cta{margin-top:38px}.phone{width:min(100%,330px)}.listen{margin-top:34px}}@media(max-width:480px){.site{padding:24px}.hero h1{font-size:clamp(52px,12vw,72px)}.phone{width:min(100%,300px)}.screen{padding:16px}.app-nav{margin-top:32px}.listen{margin-top:32px}.clip{min-height:66px}.clip .who{min-width:99px;max-width:99px;font-size:10px}.cta{font-size:15px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

<body><div class="site"><header class="header"><a class="brand" href="#top" aria-label="Howl home"><span class="mark" aria-hidden="true" id="brand-mark"></span><b>howl</b></a></header><main class="hero" id="top"><section class="copy"><p class="strapline">A social network for sound</p><h1>Hear what's<br>happening.</h1><a class="cta" href="https://testflight.apple.com/join/45K6x9tp" target="_blank" rel="noopener">Join Howl on TestFlight <span aria-hidden="true">↗</span></a></section><section class="phone-stage" aria-label="Preview Howl on an iPhone 18 Pro Max-shaped screen"><div class="phone"><div class="screen"><div class="status">9:41 <span aria-hidden="true">••• ▰</span></div><div class="app-nav"><span class="menu" aria-hidden="true"><i></i><i></i><i></i></span><b>howl</b><span class="search" aria-hidden="true">⌕</span></div><div class="pills" aria-hidden="true"><span>Following</span><b>Everyone</b></div><p class="listen">Listen now</p><div id="clips"></div><div class="mic" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3" fill="white"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-3 0h6"/></svg></div><div class="homebar" aria-hidden="true"></div></div></div></section></main><footer class="footer"><nav class="links" aria-label="Legal"><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a></nav></footer></div>
<script>
/* Only these three existing clips have publicWeb consent in this site's prior source. In-app welcome consent alone does not cover web playback. Do not add other app clips without separate permission. */
const CLIPS=[
 {handle:'dan',label:'@dan',src:'/audio/welcome-dan.m4a',seed:11,publicWeb:true},
 {handle:'vira',label:'@vira',src:'/audio/welcome-vira.m4a',seed:53,publicWeb:true},
 {handle:'samtheprompts',label:'@samtheprompts',src:'/audio/welcome-sam-dumbways.m4a',seed:89,publicWeb:true}
];
const heights=[28,44,38,34,33,31,28,26,28,29,23,13,12];document.querySelector('#brand-mark').innerHTML=heights.map(h=>`<i style="height:${Math.round(h*.5)}px"></i>`).join('');
const audio=new Audio();audio.preload='none';let active=null;
function setState(row,on){row.setAttribute('aria-pressed',String(on));row.querySelector('.play').textContent=on?'Ⅱ':'▷';row.setAttribute('aria-label',`${on?'Pause':'Play'} howl by ${row.dataset.handle}`)}
function barHeight(i,seed){const v=Math.sin(i*12.9898+seed*78.233)*43758.5453;return Math.max(3,Math.round(32*(.12+.88*(v-Math.floor(v)))))}
CLIPS.filter(c=>c.publicWeb).forEach(c=>{let row=document.createElement('button');row.type='button';row.className='clip';row.dataset.handle=c.label;row.setAttribute('aria-pressed','false');row.setAttribute('aria-label',`Play howl by ${c.label}`);let who=document.createElement('span');who.className='who';who.textContent=c.label;let wave=document.createElement('span');wave.className='wave';wave.setAttribute('aria-hidden','true');wave.innerHTML=Array.from({length:27},(_,i)=>`<i style="height:${barHeight(i,c.seed)}px"></i>`).join('');let play=document.createElement('span');play.className='play';play.setAttribute('aria-hidden','true');play.textContent='▷';row.append(who,wave,play);row.addEventListener('click',()=>{if(active===row&&!audio.paused){audio.pause();return}if(active&&active!==row)setState(active,false);if(active!==row){audio.src=c.src;active=row}audio.play().then(()=>setState(row,true)).catch(()=>setState(row,false))});document.querySelector('#clips').appendChild(row)});
audio.addEventListener('pause',()=>active&&setState(active,false));audio.addEventListener('ended',()=>active&&setState(active,false));
</script></body></html>
