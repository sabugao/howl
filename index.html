<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfd">
  <meta name="description" content="Howl. Tiny sounds from real people.">
  <title>Howl - Hear what's happening.</title>
  <style>
:root {
  --glacier: #fbfbfd;
  --ink: #0e1216;
  --pulse: #0f7c94;
  --peach: #ffc7ad;
  --mint: #9eeed6;
  --lilac: #c7b5f2;
  --white-glass: rgba(255,255,255,.48);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100svh;
  overflow-x: hidden;
  background: var(--glacier);
  color: var(--ink);
  font-family: ui-rounded, "SF Pro Rounded", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

.aurora { position: fixed; inset: 0; overflow: hidden; z-index: -2; background: var(--glacier); }
.blob { position: absolute; border-radius: 50%; filter: blur(74px); opacity: .58; will-change: transform; }
.blob-peach { width: 72vw; height: 48vw; min-height: 440px; left: -23vw; top: -17vw; background: var(--peach); animation: drift-peach 18s ease-in-out infinite alternate; }
.blob-mint { width: 72vw; height: 45vw; min-height: 430px; left: 22vw; top: 12vh; background: var(--mint); animation: drift-mint 22s ease-in-out infinite alternate; }
.blob-lilac { width: 68vw; height: 50vw; min-height: 460px; right: -18vw; bottom: -21vw; background: var(--lilac); animation: drift-lilac 25s ease-in-out infinite alternate; }
@keyframes drift-peach { to { transform: translate(11vw, 8vh) rotate(13deg) scale(1.08); } }
@keyframes drift-mint { to { transform: translate(-10vw, -7vh) rotate(-10deg) scale(.96); } }
@keyframes drift-lilac { to { transform: translate(-8vw, -9vh) rotate(15deg) scale(1.06); } }

.site-header, footer {
  width: min(1240px, calc(100% - 64px));
  margin-inline: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.site-header { height: 96px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; font-weight: 760; font-size: 27px; letter-spacing: -.05em; }
.signal { width: 32px; height: 20px; overflow: visible; }
.signal path { fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; }
.status { font-size: 13px; letter-spacing: .01em; color: rgba(14,18,22,.58); }

.hero {
  width: min(1160px, calc(100% - 64px));
  min-height: 680px;
  margin: 8px auto 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(390px, .86fr);
  align-items: center;
  gap: clamp(48px, 8vw, 120px);
}
.copy { padding-bottom: 42px; }
.eyebrow { margin: 0 0 22px; font-size: 12px; font-weight: 750; letter-spacing: .15em; text-transform: uppercase; color: var(--pulse); }
h1 { margin: 0; max-width: 710px; font-size: clamp(68px, 7.8vw, 112px); line-height: .88; letter-spacing: -.07em; font-weight: 780; }
.subhead { margin: 28px 0 34px; font-size: clamp(20px, 2.2vw, 29px); line-height: 1.35; letter-spacing: -.035em; color: rgba(14,18,22,.58); }
.coming-soon { display: inline-flex; align-items: center; gap: 10px; padding: 12px 16px; border: 1px solid rgba(255,255,255,.62); background: rgba(255,255,255,.35); backdrop-filter: blur(16px); border-radius: 999px; font-size: 13px; font-weight: 650; box-shadow: 0 12px 40px rgba(35,34,45,.06); }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--pulse); box-shadow: 0 0 0 5px rgba(15,124,148,.12); animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(.75); box-shadow: 0 0 0 9px rgba(15,124,148,.04); } }

.phone-stage { position: relative; display: grid; place-items: center; padding: 18px 0 38px; }
.orbit { position: absolute; border: 1px solid rgba(255,255,255,.62); border-radius: 50%; transform: rotate(-12deg); }
.orbit-one { width: 510px; height: 510px; }
.orbit-two { width: 420px; height: 560px; transform: rotate(19deg); }
.phone { position: relative; width: 326px; height: 660px; padding: 8px; border-radius: 52px; background: linear-gradient(145deg, #1b1c20, #050506 55%, #24252a); box-shadow: 0 38px 90px rgba(38,29,53,.21), 0 3px 7px rgba(0,0,0,.22), inset 0 0 0 1px rgba(255,255,255,.18); z-index: 1; }
.phone::after { content: ""; position: absolute; inset: 2px; border-radius: 50px; border: 1px solid rgba(255,255,255,.18); pointer-events: none; }
.phone-screen { position: relative; height: 100%; overflow: hidden; border-radius: 45px; background: rgba(251,251,253,.9); padding: 31px 13px 22px; display: flex; flex-direction: column; }
.phone-screen::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse 105% 46% at 5% 8%, rgba(255,199,173,.66), transparent 68%), radial-gradient(ellipse 100% 44% at 92% 47%, rgba(158,238,214,.61), transparent 68%), radial-gradient(ellipse 110% 47% at 24% 94%, rgba(199,181,242,.62), transparent 72%); filter: blur(13px); transform: scale(1.1); }
.dynamic-island { position: absolute; z-index: 4; top: 10px; left: 50%; width: 92px; height: 25px; border-radius: 20px; transform: translateX(-50%); background: #090909; }
.app-bar { display: flex; align-items: center; gap: 6px; height: 39px; padding: 0 4px; }
.app-signal { width: 20px; height: 12px; }
.app-signal path { stroke-width: 7; }
.app-wordmark { font-size: 18px; line-height: 1; font-weight: 790; letter-spacing: -.06em; }
.app-copy { margin: 14px 3px 12px; }
.app-copy h2 { margin: 0; font-size: 25px; line-height: 1.05; letter-spacing: -.045em; }
.app-copy p { margin: 5px 0 0; font-size: 13px; color: rgba(14,18,22,.57); }
.people-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.person-tile { position: relative; aspect-ratio: 1; border: 1px solid rgba(255,255,255,.68); border-radius: 16px; background: rgba(255,255,255,.45); box-shadow: 0 7px 22px rgba(38,29,53,.045); overflow: hidden; cursor: pointer; padding: 7px 6px 6px; display: flex; flex-direction: column; align-items: center; color: var(--ink); font: inherit; transition: transform .25s ease, box-shadow .25s ease; }
.person-tile:hover, .person-tile.playing { transform: scale(1.025); box-shadow: 0 10px 28px rgba(15,124,148,.13); }
.avatar { width: 36px; height: 36px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; color: white; font-size: 10px; font-weight: 700; border: 1px solid rgba(255,255,255,.45); }
.wave { width: 100%; height: 17px; margin: auto 0 4px; display: flex; align-items: center; justify-content: center; gap: 1.15px; }
.wave i { width: 1.5px; min-height: 2px; border-radius: 2px; background: rgba(14,18,22,.58); transition: height .25s ease, background .25s ease; }
.playing .wave i { background: var(--pulse); animation: jump .7s ease-in-out infinite alternate; animation-delay: calc(var(--n) * -35ms); }
@keyframes jump { to { height: 4px !important; } }
.tile-meta { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 2px; font-size: 7.4px; font-weight: 760; }
.play-icon { width: 16px; height: 16px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; color: white; background: var(--pulse); font-size: 7px; }
.auth-actions { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 2px 2px; }
.auth { min-height: 39px; border: 1px solid rgba(255,255,255,.66); border-radius: 999px; font: inherit; font-size: 12px; font-weight: 720; color: var(--ink); background: rgba(255,255,255,.34); backdrop-filter: blur(15px); }
.auth.primary { border-color: var(--ink); color: white; background: var(--ink); }
.home-indicator { position: absolute; bottom: 8px; left: 50%; width: 96px; height: 4px; border-radius: 8px; background: var(--ink); transform: translateX(-50%); opacity: .85; }

footer { min-height: 90px; padding: 20px 0 28px; border-top: 1px solid rgba(14,18,22,.09); font-size: 12px; color: rgba(14,18,22,.5); }
.footer-mark { display: flex; align-items: center; gap: 11px; color: rgba(14,18,22,.72); }
.footer-mark .signal { width: 22px; height: 13px; }
.footer-mark .signal path { stroke-width: 7; }

@media (max-width: 820px) {
  .site-header, footer, .hero { width: min(100% - 34px, 620px); }
  .site-header { height: 76px; }
  .brand { font-size: 23px; }
  .site-header .status { display: none; }
  .hero { min-height: 0; margin-top: 18px; display: flex; flex-direction: column; gap: 44px; }
  .copy { width: 100%; padding: 0; text-align: left; }
  .eyebrow { margin-bottom: 15px; font-size: 10px; }
  h1 { font-size: clamp(58px, 17.8vw, 86px); line-height: .9; }
  .subhead { margin: 20px 0 26px; font-size: 20px; }
  .phone-stage { width: 100%; padding-bottom: 26px; }
  .orbit-one { width: 390px; height: 390px; }
  .orbit-two { width: 330px; height: 450px; }
  .phone { width: 292px; height: 590px; border-radius: 47px; }
  .phone-screen { border-radius: 40px; padding: 29px 11px 20px; }
  .app-copy { margin-top: 10px; }
  .app-copy h2 { font-size: 22px; }
  .people-grid { gap: 6px; }
  .person-tile { border-radius: 14px; padding: 6px 5px 5px; }
  .avatar { width: 32px; height: 32px; }
  .auth-actions { padding-top: 10px; }
  footer { margin-top: 20px; min-height: 84px; align-items: flex-start; gap: 15px; flex-direction: column; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
}

  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-peach"></span>
    <span class="blob blob-mint"></span>
    <span class="blob blob-lilac"></span>
  </div>

  <header class="site-header">
    <a class="brand" href="#top" aria-label="Howl home">
      <svg class="signal" viewBox="0 0 56 30" aria-hidden="true"><path d="M8 8a22 22 0 0 0 40 0"/></svg>
      <span>howl</span>
    </a>
    <span class="status">Coming soon to TestFlight</span>
  </header>

  <main id="top" class="hero">
    <section class="copy">
      <p class="eyebrow">A social network for sound</p>
      <h1>Hear what's<br>happening.</h1>
      <p class="subhead">Tiny sounds from real people.</p>
      <div class="coming-soon">
        <span class="pulse" aria-hidden="true"></span>
        Coming soon to TestFlight
      </div>
    </section>

    <section class="phone-stage" aria-label="Preview of the Howl app">
      <div class="orbit orbit-one" aria-hidden="true"></div>
      <div class="orbit orbit-two" aria-hidden="true"></div>
      <div class="phone">
        <div class="phone-screen">
          <div class="dynamic-island" aria-hidden="true"></div>
          <div class="app-bar">
            <svg class="signal app-signal" viewBox="0 0 56 30" aria-hidden="true"><path d="M8 8a22 22 0 0 0 40 0"/></svg>
            <span class="app-wordmark">howl</span>
          </div>

          <div class="app-copy">
            <h2>Hear what's happening.</h2>
            <p>Tiny sounds from real people.</p>
          </div>

          <div class="people-grid" id="peopleGrid" aria-label="Playable sounds from people"></div>

          <div class="auth-actions">
            <button type="button" class="auth secondary">Sign up</button>
            <button type="button" class="auth primary">Log in</button>
          </div>
          <div class="home-indicator" aria-hidden="true"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-mark">
      <svg class="signal" viewBox="0 0 56 30" aria-hidden="true"><path d="M8 8a22 22 0 0 0 40 0"/></svg>
      <span>Make a sound. The pack answers.</span>
    </div>
    <span>iPhone first.</span>
  </footer>

  <script>
const people = [
  { initials: 'RB', handle: 'rafinha', color: 'linear-gradient(145deg,#ffaf65,#e66e3d)', seed: 11 },
  { initials: 'BW', handle: 'boriswei', color: 'linear-gradient(145deg,#67d9cd,#23837d)', seed: 37 },
  { initials: 'ED', handle: 'emmdias', color: 'linear-gradient(145deg,#c49a7a,#765340)', seed: 41 },
  { initials: 'DM', handle: 'danmagatti', color: 'linear-gradient(145deg,#71d9f6,#127c94)', seed: 53 },
  { initials: 'LM', handle: 'lilamoreno', color: 'linear-gradient(145deg,#f49bc4,#c6508b)', seed: 67 },
  { initials: 'TP', handle: 'theopark', color: 'linear-gradient(145deg,#9f9aef,#5a55ba)', seed: 23 },
  { initials: 'RB', handle: 'rafinha', color: 'linear-gradient(145deg,#ffaf65,#e66e3d)', seed: 71 },
  { initials: 'BW', handle: 'boriswei', color: 'linear-gradient(145deg,#67d9cd,#23837d)', seed: 17 },
  { initials: 'ED', handle: 'emmdias', color: 'linear-gradient(145deg,#c49a7a,#765340)', seed: 31 }
];

function pseudo(i, seed) {
  const value = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
  return value - Math.floor(value);
}

const grid = document.querySelector('#peopleGrid');
people.forEach((person, index) => {
  const button = document.createElement('button');
  button.className = 'person-tile';
  button.type = 'button';
  button.setAttribute('aria-label', `Play howl by @${person.handle}`);
  const bars = Array.from({ length: 17 }, (_, i) => {
    const height = Math.max(2, Math.round(3 + pseudo(i, person.seed) * 13));
    return `<i style="height:${height}px;--n:${i}"></i>`;
  }).join('');
  button.innerHTML = `
    <span class="avatar" style="background:${person.color}">${person.initials}</span>
    <span class="wave">${bars}</span>
    <span class="tile-meta"><span>@${person.handle}</span><span class="play-icon">▶</span></span>`;
  button.addEventListener('click', () => {
    grid.querySelectorAll('.person-tile').forEach((tile, tileIndex) => {
      if (tileIndex !== index) {
        tile.classList.remove('playing');
        tile.querySelector('.play-icon').textContent = '▶';
      }
    });
    button.classList.toggle('playing');
    button.querySelector('.play-icon').textContent = button.classList.contains('playing') ? 'Ⅱ' : '▶';
  });
  grid.appendChild(button);
});

  </script>
</body>
</html>
