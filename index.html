<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfd">
  <link rel="icon" href="/howl-favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico">
  <meta name="description" content="Howl. A social network for sound. Hear what's happening.">
  <title>Howl - Hear what's happening.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">
  <style>
:root {
  --glacier: #fbfbfd;
  --ink: #0e1216;
  --pulse: #4cd7f6;
  --pulse-deep: #0f7c94;
  --peach: #ffc7ad;
  --mint: #9eeed6;
  --lilac: #c7b5f2;
  --muted: rgba(14,18,22,.58);
  --pad: clamp(22px, 4vw, 56px);
  --rounded: ui-rounded, "SF Pro Rounded", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100svh;
  overflow-x: hidden;
  background: var(--glacier);
  color: var(--ink);
  font-family: var(--rounded);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }

/* Living aurora, same palette and motion as the app's HowlBackground. */
.aurora { position: fixed; inset: 0; overflow: hidden; z-index: -1; background: var(--glacier); }
/* Blobs are positioned each frame by the script below, using the same sin/cos
   motion as the app's HowlBackground (Theme.swift). */
.blob { position: absolute; left: 50%; top: 50%; border-radius: 50%; filter: blur(56px); opacity: .72; will-change: transform; }
.blob-peach { width: 118vw; height: 58vh; background: #ffc7ad; }
.blob-mint { width: 125vw; height: 52vh; background: #9eeed6; }
.blob-lilac { width: 122vw; height: 56vh; background: #c7b5f2; }

.page {
  /* Cap the composition so wide screens keep the 1440 balance; extra width goes to the margins. */
  width: 100%;
  max-width: max(1520px, min(76vw, 170vh));
  margin: 0 auto;
  min-height: 100svh;
  padding: var(--pad);
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: clamp(18px, 3vh, 36px);
}

.top, .bottom { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
.signal { width: 38px; height: 22px; overflow: visible; }
.signal path { fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; }
.wordmark { font-family: "Quicksand", var(--rounded); font-weight: 700; font-size: clamp(30px, min(1.6vw, 2.8vh), 42px); letter-spacing: -.02em; line-height: 1; }
.top-link { font-size: 17px; color: var(--muted); text-decoration: none; }
.top-link:hover, .top-link:focus-visible { color: var(--ink); }

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: clamp(28px, 5vw, 96px);
  min-height: 0;
}
.eyebrow { margin: 0 0 clamp(14px, 2vh, 24px); font-size: clamp(12px, min(1vw, 1.45vh), 21px); font-weight: 750; letter-spacing: .16em; text-transform: uppercase; color: var(--pulse-deep); }
h1 {
  margin: 0;
  font-size: clamp(64px, min(9.4vw, 15vh), 224px);
  line-height: .86;
  letter-spacing: -.065em;
  font-weight: 790;
}
/* Headline descenders overflow the tight .86 line box; pad them, then keep the old subhead rhythm before the CTA. */
h1 { padding-bottom: .14em; }
.copy h1 + .actions { margin-top: clamp(26px, 4vh, 44px); }
.subhead { margin: clamp(18px, 3vh, 30px) 0 clamp(26px, 4vh, 44px); font-size: clamp(21px, min(2.3vw, 3.4vh), 50px); line-height: 1.2; letter-spacing: -.035em; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 26px; }
.cta {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 1.05em 1.6em;
  border-radius: 999px;
  background: var(--ink); color: #fff;
  font-size: clamp(17px, min(1.3vw, 1.9vh), 27px); font-weight: 720; letter-spacing: -.01em;
  text-decoration: none;
  transition: transform .2s ease, box-shadow .2s ease;
}
.cta:hover, .cta:focus-visible { transform: translateY(-2px); box-shadow: 0 18px 46px rgba(35,34,45,.2); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pulse); box-shadow: 0 0 0 5px rgba(76,215,246,.18); animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(.75); box-shadow: 0 0 0 9px rgba(76,215,246,.05); } }
.hint { font-size: clamp(15px, 1.1vw, 17px); color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
.hint svg { width: 18px; height: 18px; fill: var(--pulse-deep); }

/* Device: the real in-app welcome wall, drawn at iPhone points (390x844) and scaled to fit. */
.stage { display: grid; place-items: center; }
.phone {
  --h: clamp(520px, 76svh, 1100px);
  height: var(--h);
  width: calc(var(--h) * 390 / 844 + 24px);
  padding: 12px;
  border-radius: calc(var(--h) * .085);
  background: linear-gradient(145deg, #1b1c20, #050506 55%, #24252a);
  box-shadow: 0 50px 110px rgba(38,29,53,.22), 0 12px 30px rgba(38,29,53,.14);
  position: relative;
}
.screen { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: calc(var(--h) * .07); background: var(--glacier); }
.canvas { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; transform: scale(var(--s, 1)); display: flex; flex-direction: column; }
.canvas::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    radial-gradient(ellipse 90% 40% at 12% 12%, rgba(255,199,173,.75), transparent 70%),
    radial-gradient(ellipse 95% 38% at 55% 52%, rgba(158,238,214,.7), transparent 70%),
    radial-gradient(ellipse 90% 42% at 85% 92%, rgba(199,181,242,.75), transparent 70%),
    var(--glacier);
}
.island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; border-radius: 20px; transform: translateX(-50%); background: #070708; z-index: 3; }
.app-bar { margin-top: 56px; padding: 14px 20px; display: flex; align-items: center; gap: 10px; }
.app-bar .signal { width: 30px; height: 17px; }
.app-bar .signal path { stroke-width: 7; }
.app-bar .wordmark { font-size: 24px; }
.app-body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 0 16px 18px; }
.app-title { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
.app-sub { margin: 6px 0 0; font-size: 20px; color: rgba(60,60,67,.6); }
.rows { display: grid; gap: 12px; }
.row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,.72);
  background: rgba(255,255,255,.48);
  color: var(--ink); font: inherit; text-align: left; cursor: pointer;
  transition: transform .2s ease, box-shadow .2s ease;
  -webkit-tap-highlight-color: transparent;
}
.row:hover { transform: scale(1.01); }
.row.playing { transform: scale(1.02); box-shadow: 0 0 24px rgba(76,215,246,.35); }
.who { width: 76px; flex: 0 0 76px; display: grid; justify-items: center; gap: 3px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 15px; font-weight: 600; border: 1px solid rgba(255,255,255,.35); }
.handle { font-size: 11px; font-weight: 600; max-width: 76px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wave { flex: 1; height: 28px; display: flex; align-items: center; justify-content: space-between; }
.wave i { display: block; flex: 0 0 auto; width: 3.5px; border-radius: 2px; background: rgba(14,18,22,.7); transition: background .2s ease; }
.playing .wave i { background: var(--pulse-deep); }
.btn { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%; background: var(--pulse-deep); display: grid; place-items: center; }
.btn svg { width: 12px; height: 12px; fill: #fff; }
/* Sized like the real app: content-width capsules in a centered row (HStack spacing 16). */
.auth { display: flex; justify-content: center; gap: 16px; padding: 0 16px 84px; }
.auth span { height: 30px; padding: 0 8px; display: grid; place-items: center; border-radius: 999px; font-size: 16px; font-weight: 600; letter-spacing: -.2px; }
.auth .secondary { background: rgba(255,255,255,.85); color: var(--ink); box-shadow: 0 4px 14px rgba(20,24,40,.10); }
.auth .primary { background: var(--ink); color: #fff; }
.home { position: absolute; bottom: 9px; left: 50%; width: 134px; height: 5px; border-radius: 5px; background: var(--ink); transform: translateX(-50%); }

.bottom { font-size: clamp(15px, min(1vw, 1.45vh), 20px); color: var(--muted); justify-content: flex-end; }
.bottom .brandline { display: inline-flex; align-items: center; gap: 10px; color: rgba(14,18,22,.75); }
.bottom .signal { width: 22px; height: 13px; }
.bottom .signal path { stroke-width: 7; }
.links { display: flex; gap: 22px; }
.links a { text-decoration: none; }
.links a:hover, .links a:focus-visible { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; gap: 40px; }
  h1 { font-size: clamp(56px, 15vw, 96px); }
  .top-link .long { display: none; }
  .phone { --h: min(680px, 150vw); }
  .stage { padding-bottom: 8px; }
}
@media (max-width: 520px) {
  .wordmark { font-size: 26px; }
  .top-link { font-size: 15px; }
  .cta { width: 100%; justify-content: center; }
  .actions { gap: 14px; }
  .bottom { flex-direction: column; align-items: flex-start; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-peach"></span>
    <span class="blob blob-mint"></span>
    <span class="blob blob-lilac"></span>
  </div>

  <div class="page">
    <header class="top">
      <a class="brand" href="#top" aria-label="Howl home">
        <svg class="signal" viewBox="0 0 56 30" aria-hidden="true"><path d="M8 8a22 22 0 0 0 40 0"/></svg>
        <span class="wordmark">howl</span>
      </a>
    </header>

    <main id="top" class="hero">
      <section class="copy">
        <p class="eyebrow">A social network for sound</p>
        <h1>Hear what's<br>happening.</h1>
        <div class="actions">
          <a class="cta" href="https://testflight.apple.com/join/45K6x9tp" target="_blank" rel="noopener">
            <span class="dot" aria-hidden="true"></span>
            Join Howl on TestFlight
          </a>
        </div>
      </section>

      <section class="stage" aria-label="Howl's welcome screen, with playable howls">
        <div class="phone">
          <div class="screen">
            <div class="canvas">
              <div class="island" aria-hidden="true"></div>
              <div class="app-bar" aria-hidden="true">
                <svg class="signal" viewBox="0 0 56 30"><path d="M8 8a22 22 0 0 0 40 0"/></svg>
                <span class="wordmark">howl</span>
              </div>
              <div class="app-body">
                <div>
                  <p class="app-title">Hear what’s happening.</p>
                </div>
                <div class="rows" id="rows"></div>
              </div>
              <div class="auth" aria-hidden="true"><span class="secondary">Sign up</span><span class="primary">Log in</span></div>
              <div class="home" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="bottom">
      <nav class="links"><a href="/privacy/">Privacy</a></nav>
    </footer>
  </div>

  <script>
/*
 * Public clip set. Only clips whose creator agreed to PUBLIC web playback
 * belong here with publicWeb: true. Consent for the in-app welcome screen
 * does not cover this page. Files live in /audio/ in this repo; never point
 * at the app's Supabase storage (that bucket is private).
 * Order and seeds match the app's WelcomeSamples.swift, minus Tuxu: he
 * declined public web use (Sep 23). His clip stays in the app only; do not
 * add it here without his new, explicit consent (HALLU-114).
 */
const HOWL_CLIPS = [
  { handle: 'dan', initials: 'D', color: '#4cd7f6', seed: 11, src: '/audio/welcome-dan.m4a', publicWeb: true },
  { handle: 'samtheprompts', initials: 'SP', color: '#30b0c7', seed: 89, src: '/audio/welcome-sam-dumbways.m4a', publicWeb: true },
  { handle: 'vira', initials: 'V', color: '#ff2d55', seed: 53, src: '/audio/welcome-vira.m4a', publicWeb: true },
  { handle: 'samtheprompts', initials: 'SP', color: '#30b0c7', seed: 37, src: '/audio/welcome-sam.m4a', publicWeb: true },
];

const PLAY = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z"/></svg>';
const PAUSE = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.5h2.6v9H2.5zM6.9 1.5h2.6v9H6.9z"/></svg>';

// Same pseudo-random bars as the app's WaveformView (32 bars).
function pseudo(i, seed) {
  const v = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
  return v - Math.floor(v);
}
function lighten(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map((x) => Math.round(x + (255 - x) * amt));
  return `rgb(${c.join(',')})`;
}

const audio = new Audio();
audio.preload = 'none';
let current = null;

function setState(row, playing) {
  row.classList.toggle('playing', playing);
  row.querySelector('.btn').innerHTML = playing ? PAUSE : PLAY;
  row.setAttribute('aria-pressed', String(playing));
}

const rowsEl = document.getElementById('rows');
HOWL_CLIPS.filter((c) => c.publicWeb).forEach((clip) => {
  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'row';
  row.setAttribute('aria-label', `Play howl by @${clip.handle}`);
  row.setAttribute('aria-pressed', 'false');
  const bars = Array.from({ length: 32 }, (_, i) => `<i style="height:${Math.max(2, 28 * (0.12 + 0.88 * pseudo(i, clip.seed))).toFixed(1)}px"></i>`).join('');
  row.innerHTML = `<span class="who"><span class="avatar" style="background:linear-gradient(180deg,${lighten(clip.color, .25)},${clip.color})">${clip.initials}</span><span class="handle" style="font-size:${clip.handle.length > 8 ? Math.max(7, 11 * 9 / clip.handle.length) : 11}px">@${clip.handle}</span></span><span class="wave" aria-hidden="true">${bars}</span><span class="btn">${PLAY}</span>`;
  row.addEventListener('click', () => {
    if (current === row && !audio.paused) { audio.pause(); return; }
    if (current && current !== row) setState(current, false);
    if (current !== row) { audio.src = clip.src; current = row; }
    audio.play().then(() => setState(row, true)).catch(() => setState(row, false));
  });
  rowsEl.appendChild(row);
});
audio.addEventListener('pause', () => current && setState(current, false));
audio.addEventListener('ended', () => current && setState(current, false));

// Scale the 390x844 app canvas to the device frame.
const screen = document.querySelector('.screen');
const canvas = document.querySelector('.canvas');
function fit() { canvas.style.setProperty('--s', screen.clientWidth / 390); }
new ResizeObserver(fit).observe(screen);
fit();
  
// Living aurora: same formula as the app's HowlBackground (offsets in viewport
// fractions, periods in seconds). Paused on prefers-reduced-motion.
(() => {
  const blobs = ['peach', 'mint', 'lilac'].map((n) => document.querySelector('.blob-' + n));
  if (blobs.some((b) => !b)) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  const place = (t) => {
    const W = window.innerWidth, H = window.innerHeight;
    const specs = [
      [-0.26 * W + Math.sin(t / 7.0) * 0.12 * W, -0.27 * H + Math.cos(t / 9.0) * 0.07 * H, Math.sin(t / 11.0) * 9],
      [Math.sin(t / 8.5) * 0.14 * W, Math.cos(t / 10.5) * 0.09 * H, Math.cos(t / 13.0) * 8],
      [0.18 * W + Math.cos(t / 9.5) * 0.12 * W, 0.31 * H + Math.sin(t / 12.0) * 0.08 * H, Math.sin(t / 14.0) * 10],
    ];
    specs.forEach(([x, y, r], i) => {
      blobs[i].style.transform = `translate(-50%, -50%) translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${r.toFixed(2)}deg)`;
    });
  };
  const t0 = Date.now() / 1000;
  let raf = 0, last = 0;
  const frame = (ms) => {
    raf = requestAnimationFrame(frame);
    if (ms - last < 33) return; // ~30 fps, like the app's TimelineView
    last = ms;
    place(Date.now() / 1000 - t0 + 40);
  };
  const start = () => { cancelAnimationFrame(raf); if (reduce.matches) { place(40); } else { raf = requestAnimationFrame(frame); } };
  reduce.addEventListener ? reduce.addEventListener('change', start) : reduce.addListener(start);
  window.addEventListener('resize', () => { if (reduce.matches) place(40); });
  place(40);
  start();
})();
</script>
</body>
</html>
