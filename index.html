const heights=[28,44,38,34,33,31,28,26,28,29,23,13,12];document.querySelector('#brand-mark').innerHTML=heights.map(h=>`<i style="height:${Math.round(h*.5)}px"></i>`).join('');
const panel=document.querySelector('#poster-panel'), picture=document.querySelector('#poster-portrait'),handle=document.querySelector('#poster-handle'),line=document.querySelector('#poster-transcript'),wave=document.querySelector('#poster-wave'),button=document.querySelector('.poster-play');
const playMark='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 5.5 18 12 8 18.5Z"/></svg>',pauseMark='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg>';
let index=0, timer=0, frame=0, voice=new Audio();voice.preload='metadata';
function paint(){const p=people[index], progress=voice.duration ? Math.min(1,voice.currentTime/voice.duration):0, current=Math.min(30,Math.floor(progress*31));[...wave.children].forEach((bar,i)=>{bar.classList.toggle('is-heard',progress>0 && i<=current);bar.classList.toggle('is-current',!voice.paused && i===current)})}
function tick(){paint();if(!voice.paused)frame=requestAnimationFrame(tick)}
function updateVoice(){button.innerHTML=voice.paused?playMark:pauseMark;button.setAttribute('aria-label',(voice.paused?'Play':'Pause')+' '+people[index].handle+' fictional voice sample');cancelAnimationFrame(frame);paint();if(!voice.paused)frame=requestAnimationFrame(tick)}
voice.addEventListener('play',()=>{clearTimeout(timer);updateVoice()});voice.addEventListener('pause',()=>{updateVoice();if(!document.hidden && !voice.ended)schedule()});voice.addEventListener('ended',()=>{updateVoice();schedule(1200)});voice.addEventListener('seeked',updateVoice);
function schedule(delay=8000){clearTimeout(timer);if(!voice.paused)return;timer=setTimeout(()=>show((index+1)%people.length),delay)}
function show(n){const next=(n+people.length)%people.length, move=next!==index, direction=(next===((index+people.length-1)%people.length))?-1:1;
let departing=null;if(move && !matchMedia('(prefers-reduced-motion: reduce)').matches){departing=panel.cloneNode(true);departing.removeAttribute('id');departing.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));departing.querySelector('.poster-play')?.setAttribute('tabindex','-1');departing.setAttribute('aria-hidden','true');departing.style.pointerEvents='none';departing.style.zIndex='2';panel.parentNode.appendChild(departing)}
clearTimeout(timer);voice.pause();voice.currentTime=0;index=next;const p=people[index];picture.src=p.portrait;picture.alt='Fictional concept portrait for '+p.handle;handle.textContent=p.handle;line.textContent='“'+p.line+'”';wave.innerHTML=p.bars.map(h=>`<i style="height:${h}px"></i>`).join('');voice.src=p.audio;voice.load();updateVoice();
if(departing){const options={duration:410,easing:'cubic-bezier(.24,.78,.20,1)'};departing.animate([{transform:'translateY(0)'},{transform:`translateY(${-direction*100}%)`}],options).onfinish=()=>departing.remove();panel.animate([{transform:`translateY(${direction*100}%)`},{transform:'translateY(0)'}],options)}schedule()}
button.addEventListener('click',event=>{event.stopPropagation();if(voice.paused){if(voice.ended)voice.currentTime=0;voice.play().catch(updateVoice)}else voice.pause()});
let startY=null;panel.addEventListener('touchstart',event=>{startY=event.touches[0].clientY},{passive:true});panel.addEventListener('touchend',event=>{if(startY!==null){const dy=event.changedTouches[0].clientY-startY;if(Math.abs(dy)>45)show(index+(dy<0?1:-1));startY=null}},{passive:true});
panel.addEventListener('wheel',event=>{if(Math.abs(event.deltaY)>18){event.preventDefault();show(index+(event.deltaY>0?1:-1))}},{passive:false});panel.addEventListener('keydown',event=>{if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();show(index+(event.key==='ArrowDown'?1:-1))}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(timer);voice.pause()}else schedule()});show(0);
</script></body></html>
